  const a = c.analysis, flags = a.flags||[], act = activeFlags(flags);
  const lines = parseTranscript(c.transcript);
  const hit = new Map(); act.forEach(f=>{ if(f.line>=0){ const s = hit.get(f.line); if(!s || SEV_RANK[f.severity]>SEV_RANK[s]) hit.set(f.line, f.severity); } });
  const running = AI.callId===id;
  const aiOk = sample && ST.settings.aiEnabled!==false;
  const restricted = act.some(x=>x.restricted) && !revealed["call-"+id];
  return `${head(`<span class="mono" style="font-family:var(--f-mono)">${esc(c.id)}</span>`, `${esc(c.product)} · ${esc(c.vendor)} · agent ${esc(c.agent)}`,
    `<button class="btn" data-act="go-back" data-fallback="calls" title="Go back to previous page" style="display:inline-flex;align-items:center;gap:6px;font-weight:600"><span style="font-size:15px;line-height:1">←</span> Back</button>
     ${running?`<button class="btn" data-act="ai-stop">Stop AI review</button>`:`<button class="btn primary" data-act="ai-run" data-id="${esc(id)}" ${aiOk?"":"disabled"} title="${aiOk?"Reads the call for meaning and context":"AI review is not available in this view"}">Run AI review</button>`}
     <button class="btn" data-act="rerun" data-id="${esc(id)}">Re-run rules</button>
     ${c.caseId?`<a class="btn" href="#case-${esc(c.caseId)}">Open ${esc(c.caseId)} →</a>`:`<button class="btn" data-act="case-manual" data-id="${esc(id)}">Open a case</button>`}`,
    `<a href="#${prevHash||'calls'}" data-act="go-back" data-fallback="calls" style="display:inline-flex;align-items:center;gap:4px;font-weight:600">← Back</a> <span style="opacity:0.4;margin:0 2px">/</span> <span class="mono">${esc(c.id)}</span>`)}
  ${running?`<div class="banner info"><span class="spin"></span> AI review is reading the call for meaning and context. This can take up to a minute.</div>`:""}

  <div class="g23">
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="card"><h2>Call details</h2>
        <div class="kv"><span>Result</span><span>${act.length?pillP(a.priority)+" · "+act.length+" active flag"+(act.length===1?"":"s"):`<span class="pill p-clean">Clean</span>`}</span>
        <span>Date and time</span><span>${esc(fmtD(c.date))} <span class="mono">${esc(c.time)}</span>${outsideWindow(c)?` <span class="src man">Outside ${esc(RB().callWindow.start)}–${esc(RB().callWindow.end)}</span>`:""}</span>
        <span>Earlier calls today</span><span>${esc(c.prior)}</span><span>Language</span><span>${esc(c.lang)}</span>
        <span>Engine</span><span>${esc(a.engine)} · rulebook v${esc(a.rulebookVersion)}</span><span>Analysed</span><span>${esc(fmtDT(a.at))}</span>
        <span>Ingested</span><span>${esc(fmtDT(c.createdAt))} · ${esc(c.source==="sample"?"sample data":c.source==="import"?"bulk import":"manual entry")}</span></div>
        ${a.aiSummary?`<div class="banner ok"><b>AI summary:</b> ${esc(a.aiSummary)}</div>`:""}
      </div>
      <div class="card"><h2>Transcript with evidence</h2><div class="tx">${lines.map((l,i)=>`<div class="txl ${hit.has(i)&&!restricted?"hit":""}"><span class="mono">${esc(l.ts)}</span><span class="who">${esc(l.speaker||"AGENT")}</span><span>${restricted&&hit.has(i)?"<i>Restricted line hidden</i>":esc(l.text)}</span></div>`).join("")}</div></div>
      <div class="card"><details id="dAddFlag"><summary style="cursor:pointer;font-weight:600">Add a concern the engine missed</summary>
        <form data-form="manual-flag" data-id="${esc(id)}" style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
          <div class="fr"><label>Category<select id="mfCat">${RB().rules.filter(r=>r.scope==="agent").map(r=>`<option value="${esc(r.id)}">${esc(r.cat)}</option>`).join("")}</select></label>

          <label>Timestamp<select id="mfTs">${lines.map((l,i)=>`<option value="${i}">${esc(l.ts)} ${esc((l.speaker||"AGENT").slice(0,8))}</option>`).join("")}</select></label></div>

function pCases(){
  const f = F.cases, q = f.q.trim().toLowerCase();
  let list = cases();
  const active = s => s!=="Closed";
  if(f.status==="active") list = list.filter(k=>active(k.status)); else if(f.status==="decided") list = list.filter(k=>k.status==="Violation confirmed"||k.status==="Not substantiated"); else if(f.status && f.status!=="all") list = list.filter(k=>k.status===f.status);
  if(f.priority) list = list.filter(k=>k.priority===f.priority);
  if(f.team) list = list.filter(k=>k.team===f.team);
  if(f.assignee==="me") list = list.filter(k=>k.assignee && k.assignee===byMe()); else if(f.assignee==="none") list = list.filter(k=>!k.assignee);
  if(f.overdue) list = list.filter(isOverdue);
  if(q) list = list.filter(k=>(k.id+" "+k.title+" "+(k.callId||"")+" "+(k.complaintId||"")+" "+k.vendor+" "+k.agent).toLowerCase().includes(q));
  list.sort((a,b)=>((a.status==="Closed")-(b.status==="Closed")) || (PRIO_RANK[b.priority]-PRIO_RANK[a.priority]) || (new Date(a.dueAt)-new Date(b.dueAt)));
  return `${head("Cases","Every flagged call and every complaint becomes a case with an owner team, a due date and a recorded human decision.", btnBack("overview"))}
  ${sbxNote()}
  <div class="card">
    <div class="filters">
      <label>Search<input id="fCasesQ" data-live="cases.q" value="${esc(f.q)}" placeholder="Case, call, complaint, vendor, agent"></label>
      <label>Status<select id="fCasesS" data-filter="cases.status">${[["active","Active (not closed)"],["Open","Open"],["Under review","Under review"],["decided","Decided, not closed"],["Closed","Closed"],["all","All"]].map(([v,l])=>`<option value="${v}" ${f.status===v?"selected":""}>${l}</option>`).join("")}</select></label>
      <label>Priority<select id="fCasesP" data-filter="cases.priority"><option value="">All</option>${["Critical","High","Medium"].map(p=>`<option ${f.priority===p?"selected":""}>${p}</option>`).join("")}</select></label>
      <label>Team<select id="fCasesT" data-filter="cases.team"><option value="">All teams</option>${TEAMS.map(t=>`<option ${f.team===t?"selected":""}>${esc(t)}</option>`).join("")}</select></label>
      <label>Assignee<select id="fCasesA" data-filter="cases.assignee">${[["","Anyone"],["me","Assigned to me"],["none","Unassigned"]].map(([v,l])=>`<option value="${v}" ${f.assignee===v?"selected":""}>${l}</option>`).join("")}</select></label>
      <label style="flex:0 0 auto;flex-direction:row;align-items:center;gap:6px;padding-bottom:8px"><input type="checkbox" id="fCasesO" data-filter="cases.overdue" ${f.overdue?"checked":""}> Overdue only</label>
    </div>
    <p class="note">${list.length} case${list.length===1?"":"s"}</p>
    ${caseTable(list, false)}
  </div>`;
}

function pCase(id){

  const call = k.callId ? ST.calls[k.callId] : null;
  const cmp = k.complaintId ? ST.complaints[k.complaintId] : null;
  const evidence = k.source==="call" ? (call ? call.analysis.flags : []) : (k.flags||[]);
  const ctx = k.source==="call" ? (call ? "call:"+call.id : null) : "case:"+k.id;
  const locked = k.restricted && !revealed[k.id];
  const st = k.status;
  let btns = "";
  if(st==="Open") btns = `<button class="btn primary" data-act="cs" data-op="review">Start review</button><button class="btn" data-act="cs" data-op="note">Add note</button>`;
  else if(st==="Under review") btns = `<button class="btn danger" data-act="cs" data-op="confirm">Confirm violation</button><button class="btn" data-act="cs" data-op="unsub">Not substantiated</button><button class="btn" data-act="cs" data-op="note">Add note</button>`;
  else if(st==="Violation confirmed"||st==="Not substantiated") btns = `<button class="btn primary" data-act="cs" data-op="close">Close case</button><button class="btn" data-act="cs" data-op="reopen">Back to review</button><button class="btn" data-act="cs" data-op="note">Add note</button>`;
  else btns = `<button class="btn" data-act="cs" data-op="reopen">Reopen</button><button class="btn" data-act="cs" data-op="note">Add note</button>`;

function pIntake(staff){
  const done = ST._lastCmp && ST._lastCmp.staff===staff ? ST._lastCmp : null;
  const form = `<form class="card" data-form="complaint" data-staff="${staff?"1":""}">
      <div class="fr"><label>What kind of contact?<select id="ciType"><option>Phone call</option><option>In-person visit</option><option>Message</option></select></label>
      <label>Loan account, last 4 digits<input id="ciAcct" inputmode="numeric" maxlength="4" placeholder="Optional"></label></div>
      <div class="fr"><label>Date<input type="date" id="ciDate" value="${dayStr(new Date())}"></label><label>Approximate time<input type="time" id="ciTime"></label></div>
      <label>What happened?<textarea id="ciText" rows="5" placeholder="Tell us in your own words. You don’t need the agent’s name or a recording."></textarea></label>
      <label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" id="ciDanger"> ${staff?"Customer feels unsafe right now":"I feel unsafe right now"}</label>
      <label>How should we update ${staff?"the customer":"you"}?<select id="ciChannel"><option>SMS</option><option>Phone call</option><option>Email</option></select></label>
      <div class="actions"><button class="btn primary" type="submit">Register complaint</button></div>
    </form>`;
  const conf = done ? `<div class="card">${done.danger?`<div class="banner crit">If ${staff?"the customer is":"you are"} in immediate danger, call 112 now. Our team has been alerted to call back urgently.</div>`:""}
      <h2>Complaint registered</h2><p class="ok-big">${esc(done.id)}</p>
      <p class="sub">${staff?"Share this reference with the customer.":"Keep this reference."} Updates will come by ${esc(done.channel)}. No recording or agent name is needed for us to investigate.</p>
      ${staff?`<div class="actions"><a class="btn primary" href="#case-${esc(done.caseId)}">Open ${esc(done.caseId)} →</a></div>`:""}
      <div class="actions"><button class="btn" data-act="cmp-new">${staff?"Log another":"Report another problem"}</button></div></div>` : "";
  if(staff) return `${head("Log a complaint","Record a complaint received by phone, email or in a branch.", btnBack("complaints"), `<a href="#${prevHash||'complaints'}" data-act="go-back" data-fallback="complaints" style="display:inline-flex;align-items:center;gap:4px;font-weight:600">← Back</a> <span style="opacity:0.4;margin:0 2px">/</span> Log`)}${sbxNote()}<div class="g2">${done?conf:form}<div class="card"><h2>What happens next</h2><ol class="sub" style="padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px"><li>A reference number is issued immediately.</li><li>Recorded calls on that date within three hours are matched and attached.</li><li>Safety reports go straight to Investigation &amp; Safety.</li><li>A reviewer investigates and records the decision.</li></ol></div></div>`;
  return `<div class="intake">
    <div class="intake-head"><span class="eyebrow">Customer support</span><h1>Report a problem with a recovery agent</h1><p>Tell us what happened during a call, message or visit about your loan. We take every report seriously and investigate it, even without a recording.</p></div>
    ${done?conf:form}
    <p class="note">If you are in immediate danger, call 112. This form is part of a proof-of-concept and uses sample data.</p>
  </div>`;
}

function testOut(){
  const t = ($("tTxt") && $("tTxt").value) || "", spk = ($("tSpk") && $("tSpk").value) || "AGENT";
  if(!t.trim()) return `<div style="font-size:12px;color:var(--muted);padding:8px;background:var(--surface-2,#f8fafc);border-radius:6px;border:1px dashed var(--line);text-align:center;">Type a phrase above or click a sample to test detection.</div>`;
  const fl = runRules({transcript:"[00:00] "+spk+": "+t, time:"12:00", prior:0}, RB());
  return fl.length ?
    `<div style="display:flex;flex-direction:column;gap:6px;">
       <div style="font-size:11.5px;font-weight:600;color:var(--crit);display:flex;align-items:center;gap:4px;">
         <span>⚠️ Flagged by ${fl.length} rule${fl.length>1?'s':''}:</span>
       </div>
       ${fl.map(f=>`
       <div style="padding:8px 10px;background:var(--crit-bg);border:1px solid var(--crit-border);border-radius:6px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
         <div style="min-width:0;">
           <div style="font-weight:600;font-size:13px;color:var(--ink);">${esc(f.category)}</div>
           <div style="font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.3;">${esc(f.why)}</div>

         <div style="flex-shrink:0;">${pillP(PRIO_OF(f.severity))}</div>
       </div>`).join("")}
     </div>`
    : `<div class="banner ok" style="margin:0;padding:8px 10px;border-radius:6px;font-size:12.5px;display:flex;align-items:center;gap:6px;"><span>✓ No rule matched. Sentence is clean under active rules.</span></div>`;
}

function pReports(){
  const d = F.reports.days, m = metrics(d);
  const cl = m.calls, ks = m.cases;
  const allFlags = cl.flatMap(c=>c.analysis.flags||[]);
  const q = src => { const r = allFlags.filter(f=>f.source===src && f.review); const v = r.filter(f=>f.review.v==="valid").length; return {n:r.length, v, fp:r.length-v}; };
  const qr = q("Rule"), qa = q("AI"), man = allFlags.filter(f=>f.source==="Manual").length;
  const decided = ks.filter(k=>k.decision); const conf = decided.filter(k=>k.decision==="confirmed").length;
  const actions = {}; ks.filter(k=>k.action).forEach(k=>actions[k.action]=(actions[k.action]||0)+1);
  const cmps = complaints().filter(c=>c.receivedAt>=cutoffIso(d));
  const linked = cmps.filter(c=>c.linkedCallId).length;
  const agents = {}; for(const c of cl){ if(isFlagged(c)){ const key = c.vendor+" · "+c.agent; agents[key]=(agents[key]||0)+1; } }
  const repeat = Object.entries(agents).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]);
  const cats = catCounts(cl);
  return `${head("Reports","Management view for Compliance, Collections and vendor governance. Export any table as CSV.", `${btnBack("overview")}${rangeChips("reports.days", d)}`)}
  <div class="kpis">
    <div class="kpi"><b>${cl.length}</b><span>Calls reviewed</span></div>
    <div class="kpi"><b>${m.flagged.length}</b><span>Calls flagged (${pct(m.flagged.length,cl.length)}%)</span></div>
    <div class="kpi"><b>${ks.length}</b><span>Cases opened</span></div>
    <div class="kpi"><b>${fmtH(m.avgFirst)}</b><span>Avg to first review</span></div>
    <div class="kpi"><b>${fmtH(m.avgClose)}</b><span>Avg to closure</span></div>
    <div class="kpi ${m.overdue.length?"warn":""}"><b>${m.overdue.length}</b><span>Open past due date</span></div>
  </div>
  <div class="g2">

function auditEvents(){
  const ev = [];
  for(const k of cases()) for(const h of (k.history||[])) ev.push({at:h.at, by:h.by, type: h.kind==="access"?"Access":"Case", ref:k.id, href:"case-"+k.id, text:h.text});
  for(const c of calls()) ev.push({at:c.createdAt, by:c.createdBy||"system", type:"Call", ref:c.id, href:"call-"+c.id, text:"Call ingested ("+(c.source==="sample"?"sample data":c.source==="import"?"bulk import":"manual entry")+") and analysed: "+activeFlags(c.analysis.flags).length+" flag(s)."});
  for(const h of (RB().history||[])) ev.push({at:h.at, by:h.by, type:"Rulebook", ref:"v"+h.version, href:"rulebook", text:h.summary});
  return ev.filter(e=>e.at).sort((a,b)=>b.at.localeCompare(a.at));
}

async function loadSampleInto(all){
  const d = buildSampleDataset(Date.now());

  if(all || !ST.rulebook) await putConfig("rulebook", d.rulebook);
  if(all || !ST.settings) await putConfig("settings", d.settings);
  for(const [coll, list] of [["calls",d.calls],["cases",d.cases],["complaints",d.complaints]]){
    for(const o of list){ if(ST[coll][o.id]) continue; await put(coll, o); if(++n % 20 === 0) toast("Loading sample data… "+n+" of "+total, 1500); }
  }

}
async function caseOp(op){
  const k = getCase(route().slice(5)); if(!k) return;
  const note = (($("csNote")||{}).value||"").trim();
  const need = ["confirm","unsub","note"].includes(op);
  if(need && note.length < 15){ toast("Write your findings first (at least a sentence). Decisions need recorded reasons."); $("csNote") && $("csNote").focus(); return; }
  const me = byMe();
  if(op==="assign"){ k.assignee = me; hist(k, "Assigned to "+(ST.mode==="shared"?"reviewer":"you")+"."); }
  if(op==="unassign"){ k.assignee = null; hist(k, "Unassigned."); }
  if(op==="review"){ k.status = "Under review"; if(!k.firstReviewAt) k.firstReviewAt = nowIso(); if(!k.assignee) k.assignee = me; hist(k, "Review started"+(note?": "+note:"")+"."); }
  if(op==="confirm"){ k.status = "Violation confirmed"; k.decision = "confirmed"; hist(k, "Violation confirmed. Findings: "+note); }
  if(op==="unsub"){ k.status = "Not substantiated"; k.decision = "unsubstantiated"; hist(k, "Not substantiated, with reasons: "+note); }
  if(op==="note"){ hist(k, "Note: "+note, "note"); }
  if(op==="reopen"){ k.status = "Under review"; k.closedAt = null; hist(k, "Returned to review"+(note?": "+note:"")+"."); }
  if(op==="close"){
    const act = ($("csAction")||{}).value || "";
    if(k.decision==="confirmed" && !act){ toast("Choose the corrective action before closing a confirmed violation."); return; }
    k.action = act || k.action || "No further action"; k.status = "Closed"; k.closedAt = nowIso();
    hist(k, "Case closed. Corrective action: "+k.action+"."+(note?" "+note:""));
    if(k.complaintId){ const c = ST.complaints[k.complaintId]; k.history.push({at:nowIso(), by:"system", kind:"system", text:"Closure update queued to the customer by "+(c?c.channel:"SMS")+"."}); }
  }
  if($("csNote")) $("csNote").value = "";
  await put("cases", k);
  toast(k.id+" updated.");
}

    const r = makeComplaint({type:$("ciType").value, date:$("ciDate").value, time:$("ciTime").value, acct, channel:$("ciChannel").value, text, danger:$("ciDanger").checked, via:staff?"staff":"customer-form"}, calls(), RB(), ST.settings, {cmp:newId("CMP"), cs:newId("CS")}, nowIso(), staff?byMe():"system");
    await put("complaints", r.cmp); await put("cases", r.cs);
    if(r.cmp.linkedCallId && ST.calls[r.cmp.linkedCallId] && ST.calls[r.cmp.linkedCallId].caseId){ const k = getCase(ST.calls[r.cmp.linkedCallId].caseId); if(k){ k.history.push({at:nowIso(), by:"system", kind:"system", text:"Customer complaint "+r.cmp.id+" received about this call ("+r.cs.id+")."}); await put("cases", k); } }
    ST._lastCmp = {id:r.cmp.id, caseId:r.cs.id, channel:r.cmp.channel, danger:r.cmp.danger, staff};
    schedule();
  },
  rulebook: async f => {
    const summary = ($("rbSummary").value||"").trim();
    if(summary.length < 5){ toast("Add a short change summary."); $("rbSummary").focus(); return; }
    const rb = clone(RB());
    const s = $("rbStart").value, e = $("rbEnd").value;
    if(toMins(s)==null || toMins(e)==null || toMins(s)>=toMins(e)){ toast("The calling window must start before it ends."); return; }
    rb.callWindow = {start:s, end:e}; rb.repeatLimit = Math.max(1, parseInt($("rbRepeat").value,10)||3);
    const bad = [];
    rb.rules.forEach((r,i)=>{
      r.enabled = $("rbEn"+i).checked; r.cat = $("rbCat"+i).value.trim()||r.cat; r.sev = $("rbSev"+i).value; r.team = $("rbTeam"+i).value;
      r.ref = $("rbRef"+i).value.trim(); r.why = $("rbWhy"+i).value.trim(); r.next = $("rbNext"+i).value.trim(); r.restricted = $("rbRes"+i).checked;
      r.pats = $("rbPats"+i).value.split("\n").map(x=>x.trim()).filter(Boolean);
      r.pats.forEach(p=>{ try{ new RegExp(p); }catch(err){ bad.push(r.cat+": "+p); } });
    });
    if(bad.length){ toast("Fix invalid pattern: "+bad[0], 5000); return; }
    rb.version = RB().version + 1; rb.updatedAt = nowIso();
    rb.history = (rb.history||[]).concat([{version:rb.version, at:nowIso(), by:byMe(), summary}]);
    $("rbSummary").value = "";
    await putConfig("rulebook", rb);
    toast("Rulebook v"+rb.version+" saved. Re-analyse calls to apply it to past results.", 5000);
  },
  settings: async f => {
    const s = clone(ST.settings);
    for(const p of ["Critical","High","Medium"]) s.sla[p] = Math.max(1, parseInt($("sla"+p).value,10)||s.sla[p]);
    s.aiEnabled = $("setAi").checked;
    await putConfig("settings", s); toast("Settings saved.");
  }
};
async function doImport(){
  IMPMSG = "";
  let text = ($("impText").value||"").trim();
  const file = $("impFile").files && $("impFile").files[0];
  if(file) text = (await file.text()).trim();
  if(!text){ toast("Choose a file or paste CSV or JSON."); return; }
  let rows = [];
  try{
    if(text[0]==="[" || text[0]==="{"){ const j = JSON.parse(text); rows = (Array.isArray(j)?j:(j.calls||[])).map(o=>({...o, transcript: Array.isArray(o.transcript)?o.transcript.join("\n"):o.transcript})); }
    else { const t = parseCSV(text); const h = t[0].map(x=>x.trim().toLowerCase()); rows = t.slice(1).map(r=>{ const o = {}; h.forEach((k,i)=>o[k]=r[i]); return o; }); }
  }catch(e){ IMPMSG = `<div class="banner crit">Could not read that data: ${esc(e.message)}</div>`; schedule(); return; }
  const get = (o, ...ks) => { for(const k of ks){ if(o[k]!=null && String(o[k]).trim()!=="") return String(o[k]).trim(); } return ""; };
  let ok = 0, skipped = 0, flagged = 0; const errs = [];
  for(let i=0;i<rows.length;i++){
    const o = rows[i];
    const tx = get(o,"transcript","text").split(/\s*\|\|\s*/).join("\n");
    if(!tx){ skipped++; errs.push("Row "+(i+2)+": no transcript"); continue; }
    const date = get(o,"date"); if(date && !/^\d{4}-\d{2}-\d{2}$/.test(date)){ skipped++; errs.push("Row "+(i+2)+": date must be YYYY-MM-DD"); continue; }
    const c = await ingestCall({id:get(o,"call_id","id"), vendor:get(o,"vendor"), agent:get(o,"agent","agent_id"), product:get(o,"product"), lang:get(o,"language","lang"), date, time:get(o,"time"), prior:get(o,"prior_calls","prior"), transcript:tx}, {source:"import"});
    ok++; if(isFlagged(c)) flagged++;
    if(ok % 10 === 0) toast("Imported "+ok+"…", 1200);
  }
  $("impText").value = ""; try{ $("impFile").value = ""; }catch(e){}
  IMPMSG = `<div class="banner ${ok?"ok":"warn"}">Imported ${ok} call${ok===1?"":"s"}; ${flagged} flagged and opened as cases.${skipped?" Skipped "+skipped+": "+esc(errs.slice(0,3).join("; ")):""}</div>`;
  schedule();
}
function doExport(what){
  const d = F.reports.days, cd = cutoffDay(d), ci = cutoffIso(d);
  const cl = calls().filter(c=>c.date>=cd), ks = cases().filter(k=>k.createdAt>=ci);
  if(what==="cases") return offerFile("cases-"+dayStr(new Date())+".csv", toCSV([["case_id","source","call_id","complaint_id","priority","status","team","vendor","agent","title","created","due","first_review","decision","corrective_action","closed","overdue"]].concat(ks.map(k=>[k.id,k.source,k.callId||"",k.complaintId||"",k.priority,k.status,k.team,k.vendor,k.agent,k.title,k.createdAt,k.dueAt,k.firstReviewAt||"",k.decision||"",k.action||"",k.closedAt||"",isOverdue(k)?"yes":"no"]))));
  if(what==="calls") return offerFile("calls-"+dayStr(new Date())+".csv", toCSV([["call_id","date","time","vendor","agent","product","language","prior_calls","result","active_flags","engine","rulebook_version","case_id"]].concat(cl.map(c=>[c.id,c.date,c.time,c.vendor,c.agent,c.product,c.lang,c.prior,callPrio(c),activeFlags(c.analysis.flags).length,c.analysis.engine,c.analysis.rulebookVersion,c.caseId||""]))));
  if(what==="flags") return offerFile("flags-"+dayStr(new Date())+".csv", toCSV([["call_id","timestamp","category","severity","source","review","quote","rule_reference"]].concat(cl.flatMap(c=>(c.analysis.flags||[]).map(f=>[c.id,f.ts,f.category,f.severity,f.source,f.review?f.review.v:"",f.quote,f.ref])))));
  if(what==="summary"){
    const m = metrics(d), cats = catCounts(cl);
    const md = `# Recovery compliance summary\n\nPeriod: ${d==="all"?"all time":"last "+d+" days"} · generated ${fmtDT(nowIso())}\n\n| Measure | Value |\n|---|---|\n| Calls reviewed | ${cl.length} |\n| Calls flagged | ${m.flagged.length} (${pct(m.flagged.length,cl.length)}%) |\n| Cases opened | ${ks.length} |\n| Open cases now | ${m.open.length} |\n| Critical open | ${m.critOpen.length} |\n| Past due date | ${m.overdue.length} |\n| Avg time to first review | ${fmtH(m.avgFirst)} |\n| Avg time to closure | ${fmtH(m.avgClose)} |\n\n## Concerns by category\n\n${cats.map(([c,n])=>"- "+c+": "+n).join("\n")||"- None"}\n\nRulebook version ${RB().version}. \n`;
    return offerFile("compliance-summary-"+dayStr(new Date())+".md", md);
  }
}
async function offerFile(name, text){
  if(downloads){
    try{ await downloads.save({filename:name, data:text}); toast(name+" saved."); return; }
    catch(e){ if(e && e.code==="declined") return; if(e && e.code==="rate_limited"){ toast("A save prompt is already open."); return; } }
  }
  openModal(`<h2 style="margin:0;font-size:18px">${esc(name)}</h2><p class="sub">Downloads are not available in this view. Copy the contents below.</p><textarea id="dlText" class="mono" rows="14" readonly>${esc(text)}</textarea><div class="actions"><button class="btn primary" id="dlCopy">Copy</button><button class="btn" id="dlClose">Close</button></div>`);
  $("dlCopy").onclick = async ()=>{ try{ await navigator.clipboard.writeText(text); toast("Copied."); }catch(e){ const t = $("dlText"); t.focus(); t.select(); toast("Press Ctrl+C or ⌘C to copy."); } };
  $("dlClose").onclick = closeModal;
}

/* ================= wiring ================= */
document.addEventListener("click", e=>{
  const a = e.target.closest("[data-act]");
  if(a && ACT[a.dataset.act]){ if(a.tagName!=="TR" && a.dataset.act!=="modal-bg") e.preventDefault(); ACT[a.dataset.act](a, e); return; }
  const tr = e.target.closest("tr[data-href]");
  if(tr && !e.target.closest("a,button,input,select")){ location.hash = tr.dataset.href; }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && $("modalRoot").innerHTML){ closeModal(); return; }
  if((e.ctrlKey || e.metaKey) && (e.key==="b" || e.key==="B")){ e.preventDefault(); ACT["toggle-nav"](); return; }
  const tr = e.target.closest && e.target.closest("tr[data-href],tr[data-act]");
  if(tr && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); if(tr.dataset.href) location.hash = tr.dataset.href; else ACT[tr.dataset.act](tr, e); }
});
document.addEventListener("submit", e=>{ const f = e.target; if(f.dataset && f.dataset.form && FORM[f.dataset.form]){ e.preventDefault(); FORM[f.dataset.form](f); } });
document.addEventListener("change", e=>{
  const el = e.target;
  if(el.dataset && el.dataset.filter){ const [a,b] = el.dataset.filter.split("."); F[a][b] = el.type==="checkbox" ? el.checked : el.value; if(a==="calls") F.callsLimit = 50; schedule(); return; }
  if(el.dataset && el.dataset.onchange && CHG[el.dataset.onchange]) CHG[el.dataset.onchange](el);
});
let liveT = null;
document.addEventListener("input", e=>{
  const el = e.target;
  if(el.dataset && el.dataset.live){ const [a,b] = el.dataset.live.split("."); F[a][b] = el.value; clearTimeout(liveT); liveT = setTimeout(schedule, 220); }
  if(el.dataset && el.dataset.liveTest){ CHG.test(); }
});
window.addEventListener("hashchange", ()=>{
  const nextR = route();
  if(nextR !== currentHash) {
    prevHash = currentHash;
    currentHash = nextR;
  }
  if(route()!=="intake" && route()!=="log") ST._lastCmp = null;
  if(route()!=="add") IMPMSG = "";
  schedule();
});

init().catch(e=>{ console.error(e); startSandbox(sbxLoad()); });
})();

</script>
