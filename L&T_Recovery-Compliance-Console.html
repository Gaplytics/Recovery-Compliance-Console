<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Recovery Compliance Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600&display=swap">
<style>
/* Layout: operations console. Fixed left navigation on desktop (horizontal on phones); each module renders into one work area of cards, tables and detail panes. */
:root{
  /* Crisp White Theme Surfaces & Backgrounds */
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface-2: #F1F5F9;
  --surface-3: #E2E8F0;

  /* Text & Typography */
  --ink: #0F172A;
  --muted: #475569;
  --line: #E2E8F0;
  --line-strong: #CBD5E1;

  /* Brand Accent - Modern Deep Emerald / Teal */
  --accent: #0F766E;
  --accent-hover: #115E59;
  --accent-ink: #FFFFFF;
  --accent-soft: #CCFBF1;
  --accent-light: #F0FDFA;

  /* Crisp White Navigation Bar */
  --nav: #FFFFFF;
  --nav-ink: #1E293B;
  --nav-muted: #64748B;
  --nav-hover: #F8FAFC;
  --nav-active: #F0FDFA;
  --nav-active-ink: #0F766E;

  /* Severity & Status Badges (Clear & Accessible) */
  --crit: #DC2626;
  --crit-bg: #FEF2F2;
  --crit-border: #FECACA;
  --high: #D97706;
  --high-bg: #FFFBEB;
  --high-border: #FDE68A;
  --med: #B45309;
  --med-bg: #FEFCE8;
  --med-border: #FEF08A;
  --ok: #16A34A;
  --ok-bg: #F0FDF4;
  --ok-border: #BBF7D0;
  --info: #2563EB;
  --info-bg: #EFF6FF;
  --info-border: #BFDBFE;

  /* Highlight & Charts */
  --hl: #FEF9C3;
  --hl-border: #FEF08A;
  --bar2: #CBD5E1;

  /* Depth & Shadows */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.03);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.03);

  /* Fonts */
  --f-display: 'Source Serif 4', Georgia, serif;
  --f-ui: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
}

/* Optional Dark Theme (accessible via data-theme="dark" if toggled) */
:root[data-theme="dark"]{
  --bg: #0B0F17; --surface: #131A26; --surface-2: #1A2333; --surface-3: #26334A;
  --ink: #F1F5F9; --muted: #94A3B8; --line: #26334A; --line-strong: #334462;
  --accent: #2DD4BF; --accent-hover: #14B8A6; --accent-ink: #0B0F17; --accent-soft: #133E3B; --accent-light: #0D2B29;
  --nav: #0E1522; --nav-ink: #F1F5F9; --nav-muted: #8493A8; --nav-hover: #152033; --nav-active: #133E3B; --nav-active-ink: #2DD4BF;
  --crit: #F87171; --crit-bg: #351518; --crit-border: #5C1D24;
  --high: #FBBF24; --high-bg: #36220B; --high-border: #5E390C;
  --med: #FDE047; --med-bg: #332B0B; --med-border: #57480C;
  --ok: #4ADE80; --ok-bg: #0F331F; --ok-border: #16562E;
  --info: #60A5FA; --info-bg: #14284B; --info-border: #1E3D73;
  --hl: #393213; --hl-border: #5E521C; --bar2: #334462;
  color-scheme: dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 14.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside.nav{
  background: var(--nav);
  color: var(--nav-ink);
  padding: 22px 14px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  border-right: 1px solid var(--line);
  box-shadow: 1px 0 2px rgba(0,0,0,0.02);
}
.brand{
  padding: 4px 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  border-bottom: 1px solid var(--line);
}
.eyebrow{
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
}
.brand b{
  font-family: var(--f-display);
  font-size: 19px;
  line-height: 1.2;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.navlist{display:flex;flex-direction:column;gap:3px}
.navlist a{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  color: var(--nav-ink);
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 500;
  transition: all 0.15s ease;
}
.navlist a:hover{
  background: var(--nav-hover);
  color: var(--ink);
}
.navlist a.on{
  background: var(--nav-active);
  color: var(--nav-active-ink);
  font-weight: 600;
  box-shadow: inset 3px 0 0 var(--accent);
}
.navlist .cnt{
  font-size: 11px;
  font-weight: 600;
  background: var(--surface-2);
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 7px;
  line-height: 1;
}
.navlist .cnt.crit{
  background: var(--crit-bg);
  color: var(--crit);
  border-color: var(--crit-border);
}
.navsec{
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #94A3B8;
  padding: 14px 12px 4px;
}
.navfoot{
  margin-top: auto;
  font-size: 12px;
  color: var(--nav-muted);
  padding: 14px 8px 0;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.mode{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  background: #ECFDF5;
  color: #047857;
  border: 1px solid #A7F3D0;
  width: fit-content;
}
.mode.sbx{
  background: #FFFBEB;
  color: #B45309;
  border: 1px solid #FDE68A;
}
main{
  min-width: 0;
  padding-block: 28px 64px;
  padding-left: max(28px, env(safe-area-inset-left, 0px));
  padding-right: max(28px, env(safe-area-inset-right, 0px));
}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.ph h1{
  font-family: var(--f-display);
  font-weight: 600;
  font-size: clamp(23px, 2.8vw, 30px);
  line-height: 1.2;
  color: var(--ink);
  margin: 0;
  text-wrap: balance;
  letter-spacing: -0.01em;
}
.ph p{margin:5px 0 0;color:var(--muted);font-size:14px;max-width:70ch;line-height:1.45}
.crumb{font-size:13px;color:var(--muted);margin-bottom:2px}
.crumb a{color:var(--accent);text-decoration:none;font-weight:500}
.crumb a:hover{text-decoration:underline}
.card{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px 24px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}
.card h2{font-size:16px;font-weight:600;color:var(--ink);margin:0;letter-spacing:-0.01em}
.card h3{font-size:14px;font-weight:600;color:var(--ink);margin:0}
.sub,.note{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.g32{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}
.g23{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:18px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.kpi{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.kpi:hover{box-shadow:var(--shadow)}
.kpi b{
  font-size: 26px;
  font-weight: 700;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  letter-spacing: -0.02em;
}
.kpi span{
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  line-height: 1.3;
}
.kpi.crit b{color:var(--crit)}
.kpi.warn b{color:var(--high)}
label{
  font-size: 12.5px;
  font-weight: 600;
  color: #334155;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
input,select,textarea{
  font: 14px var(--f-ui);
  color: var(--ink);
  background: #FFFFFF;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 9px 12px;
  width: 100%;
  min-width: 0;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
input:focus,select:focus,textarea:focus{
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea{line-height:1.5;resize:vertical}
textarea.mono{font-family:var(--f-mono);font-size:13px}
input[type=checkbox]{width:auto;cursor:pointer;accent-color:var(--accent)}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters label{flex:1 1 160px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{
  appearance: none;
  font: 600 13px var(--f-ui);
  border-radius: 8px;
  padding: 8px 15px;
  cursor: pointer;
  border: 1px solid var(--line-strong);
  background: #FFFFFF;
  color: #1E293B;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s ease;
}
.btn:hover{
  background: #F8FAFC;
  border-color: #94A3B8;
  color: var(--ink);
}
.btn.primary{
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 1px 3px rgba(15,118,110,0.25);
}
.btn.primary:hover{
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  box-shadow: 0 2px 6px rgba(15,118,110,0.35);
}
.btn.danger{
  background: var(--crit-bg);
  border-color: var(--crit-border);
  color: var(--crit);
}
.btn.danger:hover{
  background: #FEE2E2;
  border-color: var(--crit);
}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.link{
  color: var(--accent);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
  background: none;
  border: 0;
  font: inherit;
  padding: 0;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{
  display: inline-flex;
  align-items: center;
  font-size: 11.5px;
  font-weight: 600;
  padding: 2.5px 9px;
  border-radius: 999px;
  letter-spacing: .01em;
  white-space: nowrap;
  line-height: 1.3;
}
.p-critical{background:var(--crit-bg);color:#B91C1C;border:1px solid var(--crit-border)}
.p-high{background:var(--high-bg);color:#B45309;border:1px solid var(--high-border)}
.p-medium{background:var(--med-bg);color:#A16207;border:1px solid var(--med-border)}
.p-clean{background:var(--ok-bg);color:#15803D;border:1px solid var(--ok-border)}
.st{background:#F1F5F9;color:var(--ink);border:1px solid var(--line)}
.st-open{background:var(--info-bg);color:#1D4ED8;border:1px solid var(--info-border)}
.st-closed{background:#F1F5F9;color:#64748B;border:1px solid var(--line)}
.st-confirmed{background:var(--crit-bg);color:#B91C1C;border:1px solid var(--crit-border)}
.src{
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 6px;
  border: 1px solid var(--line-strong);
  color: var(--muted);
  background: #F8FAFC;
  white-space: nowrap;
}
.src.ai{border-color:#99F6E4;color:#0F766E;background:#F0FDFA}
.src.man{border-color:#FDE68A;color:#B45309;background:#FFFBEB}
.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.tw{
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #FFFFFF;
  box-shadow: var(--shadow-sm);
}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  background: #F8FAFC;
}
td{
  padding: 11px 14px;
  border-bottom: 1px solid #F1F5F9;
  vertical-align: middle;
  color: var(--ink);
}
tr:last-child td{border-bottom:0}
tr.rowlink{cursor:pointer;transition:background 0.12s ease}
tr.rowlink:hover td{background:#F8FAFC}
td a.mono,td.mono{white-space:nowrap;font-weight:500}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.flag{
  border: 1px solid var(--line);
  border-left: 4px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.flag.s-critical{border-left-color:var(--crit)}
.flag.s-high{border-left-color:var(--high)}
.flag.s-medium{border-left-color:var(--med)}
.flag.fp{opacity:.6;background:#FAFAFA}
.fh{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.fh strong{font-size:14.5px;color:var(--ink);margin-right:auto}
blockquote{
  margin: 0;
  padding: 8px 14px;
  background: #F8FAFC;
  border-left: 3px solid var(--line-strong);
  border-radius: 4px;
  font-size: 13.5px;
  font-style: italic;
  color: #1E293B;
  line-height: 1.5;
}
dl.ev{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 14px;margin:0;font-size:13px}
dl.ev dt{color:var(--muted);font-weight:600}
dl.ev dd{margin:0;min-width:0;color:var(--ink)}
.tx{
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 440px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px;
  background: #FFFFFF;
}
.txl{
  display: grid;
  grid-template-columns: 52px 90px minmax(0,1fr);
  gap: 10px;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 13px;
  transition: background 0.1s ease;
}
.txl:hover{background:#F8FAFC}
.txl.hit{background:#FEF9C3;border:1px solid #FEF08A}
.txl .who{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.04em;padding-top:2px}
.banner{
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 13.5px;
  border: 1px solid transparent;
  line-height: 1.5;
}
.banner.crit{background:var(--crit-bg);color:#991B1B;border-color:var(--crit-border);font-weight:500}
.banner.ok{background:var(--ok-bg);color:#166534;border-color:var(--ok-border)}
.banner.info{background:var(--info-bg);color:#1E40AF;border-color:var(--info-border)}
.banner.warn{background:var(--high-bg);color:#92400E;border-color:var(--high-border)}
.empty{
  color: var(--muted);
  font-size: 14px;
  padding: 32px 20px;
  text-align: center;
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  background: #FFFFFF;
}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px}
.hist .t{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:#F1F5F9;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--accent)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 999px;
  background: #FFFFFF;
  border: 1px solid var(--line-strong);
  color: var(--muted);
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.15s ease;
}
.chip:hover{border-color:#94A3B8;color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.toast{
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: #0F172A;
  color: #F8FAFC;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 500;
  max-width: min(420px, calc(100vw - 32px));
  box-shadow: var(--shadow-lg);
  z-index: 50;
  border: 1px solid #334155;
}
.overlay{
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.45);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 40;
}
.modal{
  background: var(--surface);
  border-radius: 14px;
  padding: 24px;
  max-width: 640px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
}
details summary{
  cursor: pointer;
  font-weight: 600;
  color: var(--ink);
  padding: 4px 0;
  user-select: none;
}
details summary:hover{color:var(--accent)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.intake{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.intake-head{
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 26px 30px;
  box-shadow: var(--shadow);
}
.intake-head h1{font-family:var(--f-display);font-size:28px;margin:6px 0 8px;font-weight:600;color:var(--ink)}
.intake-head p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
.ok-big{font-size:28px;font-family:var(--f-mono);font-weight:500}
svg text{font-family:var(--f-ui)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94A3B8}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
/* ===== Responsive & Mobile First Stylesheet ===== */

/* Desktop Navigation (min-width: 901px) */
@media (min-width: 901px) {
  .app{
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    min-height: 100vh;
    transition: grid-template-columns 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  body.nav-collapsed .app{
    grid-template-columns: 68px minmax(0, 1fr);
  }

  aside.nav{
    background: var(--nav);
    color: var(--nav-ink);
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    border-right: 1px solid var(--line);
    box-shadow: 1px 0 2px rgba(0, 0, 0, 0.02);
    transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1), padding 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    width: 240px;
    box-sizing: border-box;
  }

  body.nav-collapsed aside.nav{
    width: 68px;
    padding: 18px 8px;
  }

  .brand{
    padding: 2px 4px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    border-bottom: 1px solid var(--line);
  }
  .brand-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 36px;
  }
  .brand-info{
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    overflow: hidden;
  }
  .nav-theme-toggle-mobile{
    display: none !important;
  }
  .nav-toggle-btn{
    appearance: none;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--muted);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .nav-toggle-btn:hover{
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  body.nav-collapsed .brand{
    padding: 0 0 12px;
    align-items: center;
  }
  body.nav-collapsed .brand-top{
    justify-content: center;
    width: 100%;
  }
  body.nav-collapsed .brand-info{
    display: none;
  }
  body.nav-collapsed .nav-toggle-btn{
    margin: 0 auto;
  }

  .navlist{
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .navlist a{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--nav-ink);
    text-decoration: none;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 500;
    transition: all 0.15s ease;
    position: relative;
    min-height: 36px;
    box-sizing: border-box;
  }
  .navlist a:hover{
    background: var(--nav-hover);
    color: var(--ink);
  }
  .navlist a.on{
    background: var(--nav-active);
    color: var(--nav-active-ink);
    font-weight: 600;
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .nav-icon{
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    transition: color 0.15s ease;
  }
  .navlist a:hover .nav-icon,
  .navlist a.on .nav-icon{
    color: var(--accent);
  }
  .nav-label{
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .navlist .cnt{
    font-size: 11px;
    font-weight: 600;
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 7px;
    line-height: 1;
    flex-shrink: 0;
  }
  .navlist .cnt.crit{
    background: var(--crit-bg);
    color: var(--crit);
    border-color: var(--crit-border);
  }

  body.nav-collapsed .navlist a{
    padding: 8px 0;
    justify-content: center;
    width: 100%;
  }
  body.nav-collapsed .nav-label{
    display: none;
  }
  body.nav-collapsed .nav-icon{
    margin: 0;
  }
  body.nav-collapsed .navlist .cnt{
    position: absolute;
    top: 3px;
    right: 6px;
    font-size: 9px;
    padding: 1px 4.5px;
    min-width: 15px;
    text-align: center;
    border-radius: 999px;
    box-shadow: 0 0 0 1.5px var(--nav);
  }
  body.nav-collapsed .navsec{
    height: 1px;
    padding: 0;
    margin: 8px 6px;
    background: var(--line);
    overflow: hidden;
    text-indent: -9999px;
  }
  body.nav-collapsed .navfoot{
    padding: 12px 0 0;
    align-items: center;
  }
  body.nav-collapsed .navfoot .foot-desc,
  body.nav-collapsed .navfoot .foot-ai{
    display: none;
  }
  body.nav-collapsed .navfoot .mode{
    font-size: 0;
    width: 10px;
    height: 10px;
    padding: 0;
    border-radius: 50%;
    margin: 0 auto;
  }
  body.nav-collapsed .nav-theme-toggle{
    font-size: 0 !important;
    width: 36px;
    height: 36px;
    padding: 0;
    display: flex !important;
    align-items: center;
    justify-content: center;
    margin: 6px auto 0 !important;
  }
  body.nav-collapsed .nav-theme-toggle::after{
    content: "🌙";
    font-size: 14px;
    line-height: 1;
  }
  :root[data-theme="dark"] body.nav-collapsed .nav-theme-toggle::after{
    content: "☀️";
  }
}

/* Tablet & Mobile Screens (max-width: 900px) */
@media (max-width: 900px) {
  .app{
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    width: 100%;
  }
  body.nav-collapsed .app{
    grid-template-columns: none;
  }
  aside.nav{
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    height: auto;
    padding: 0;
    background: var(--nav);
    border-right: 0;
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: visible;
  }

  /* Mobile Brand Header Bar */
  .brand{
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    background: var(--nav);
  }
  .brand-top{
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 32px;
  }
  .brand-info{
    display: flex !important;
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }
  .brand-info .eyebrow{
    background: var(--surface-2);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .brand-info b{
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
  }
  .nav-theme-toggle-mobile{
    display: flex !important;
    appearance: none;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    transition: all 0.15s ease;
  }
  .nav-theme-toggle-mobile:hover{
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }
  .nav-toggle-btn{
    display: none !important;
  }

  /* Mobile Horizontal Scrollable Pill Navigation */
  .navlist{
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background: var(--nav);
  }
  .navlist::-webkit-scrollbar{
    display: none;
  }
  .navlist a{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--line);
    white-space: nowrap;
    flex-shrink: 0;
    min-height: 32px;
    box-sizing: border-box;
    box-shadow: none;
    transition: all 0.15s ease;
  }
  .navlist a:hover{
    background: var(--nav-hover);
    color: var(--ink);
  }
  .navlist a.on{
    background: var(--accent) !important;
    color: #FFFFFF !important;
    border-color: var(--accent) !important;
    box-shadow: 0 1px 3px rgba(15, 118, 110, 0.3) !important;
  }
  .navlist a.on .nav-icon,
  .navlist a.on .nav-label{
    color: #FFFFFF !important;
  }
  .navlist a.on .cnt{
    background: rgba(255, 255, 255, 0.25) !important;
    color: #FFFFFF !important;
    border-color: transparent !important;
    box-shadow: none !important;
  }
  .nav-label{
    display: inline-block !important;
  }
  .nav-icon{
    width: 16px;
    height: 16px;
    color: inherit;
  }
  .navlist .cnt{
    position: static !important;
    font-size: 10px;
    padding: 1.5px 5.5px;
    box-shadow: none !important;
    margin-left: 2px;
  }
  .navsec{
    width: 1px;
    height: 18px;
    background: var(--line);
    margin: 0 2px;
    flex-shrink: 0;
    padding: 0;
    overflow: hidden;
    text-indent: -9999px;
  }
  .navfoot{
    display: none !important;
  }

  /* Content area on Tablet & Mobile */
  main{
    padding: 16px 14px 48px;
    width: 100%;
    box-sizing: border-box;
  }
  .page{
    gap: 16px;
  }
  .card{
    padding: 16px 14px;
    border-radius: 12px;
    gap: 12px;
  }
  .ph{
    gap: 10px;
    flex-direction: column;
    align-items: flex-start;
  }
  .ph h1{
    font-size: 22px;
  }
  .ph .actions{
    width: 100%;
    justify-content: flex-start;
  }
  .ph .actions .btn{
    flex: 1 1 auto;
  }

  /* Responsive Grids on Tablet & Mobile */
  .g2, .g32, .g23, .g-queue-vendors{
    grid-template-columns: minmax(0, 1fr) !important;
    gap: 16px;
  }

  /* Responsive KPIs */
  .kpis{
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .kpi{
    padding: 12px 10px;
  }
  .kpi b{
    font-size: 20px;
  }
  .kpi span{
    font-size: 11px;
  }

  /* Responsive Filters */
  .filters{
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .filters label{
    flex: 1 1 100%;
    width: 100%;
  }
  .filters input, .filters select{
    width: 100%;
    height: 38px;
    font-size: 14px;
    box-sizing: border-box;
  }
}

/* Small Screens & Mobile Phones (max-width: 560px) */
@media (max-width: 560px) {
  .kpis{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .bar{
    grid-template-columns: minmax(0, 95px) minmax(0, 1fr) 28px;
  }
  /* Touch-friendly transcripts */
  .txl{
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 10px;
  }
  .txl .who{
    display: inline-block !important;
    font-weight: 700;
    font-size: 11px;
    color: var(--accent);
  }
  .txl .mono{
    font-size: 11px;
    color: var(--muted);
  }
  /* Key Value specs */
  .kv{
    grid-template-columns: auto minmax(0, 1fr);
    gap: 6px 12px;
    font-size: 13px;
  }
  /* Touch buttons */
  .btn{
    padding: 9px 14px;
    font-size: 13px;
  }
  .btn.sm{
    padding: 6px 10px;
    font-size: 12px;
  }
  /* Modals on small screens */
  .modalRoot{
    padding: 12px;
  }
  .modal{
    padding: 18px 14px;
    border-radius: 12px;
    max-height: 90vh;
  }
}

/* Table Wrappers: smooth touch momentum scrolling */
.tw{
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #FFFFFF;
  box-shadow: var(--shadow-sm);
  width: 100%;
}

/* Vendor Ranking Table in Overview */
.vendor-rank-tbl{
  width: 100%;
  border-collapse: collapse;
}
.vendor-rank-tbl th{
  padding: 10px 14px;
}
.vendor-rank-tbl td{
  padding: 12px 14px;
  vertical-align: middle;
}
.rate-bar-cell{
  display: flex;
  align-items: center;
  gap: 12px;
}
.rate-val{
  font-size: 13px;
  font-weight: 600;
  width: 52px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.rate-track{
  flex: 1;
  max-width: 220px;
  height: 8px;
  background: var(--surface-2);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.rate-fill{
  height: 100%;
  border-radius: 999px;
  transition: width 0.3s ease;
}
.fill-crit{ background: #EF4444; }
.fill-warn{ background: #F59E0B; }
.fill-ok{ background: #0F766E; }
.text-crit{ color: #DC2626 !important; }
.text-warn{ color: #D97706 !important; }
.text-ok{ color: #0F766E !important; }

/* "See details →" Button Style across all tables */
.btn-detail{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  background: var(--surface-2);
  border: 1px solid var(--line);
  padding: 4px 10px;
  border-radius: 6px;
  text-decoration: none;
  white-space: nowrap;
  transition: all 0.15s ease;
  cursor: pointer;
}
.btn-detail:hover{
  background: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent-hover);
  text-decoration: none;
  box-shadow: 0 1px 2px rgba(15, 118, 110, 0.1);
}
tr.rowlink:hover .btn-detail{
  background: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent-hover);
}

/* Priority Queue & Cases Table Enhancements */
.case-tbl{
  width: 100%;
  border-collapse: collapse;
}
.case-tbl th{
  padding: 10px 14px;
  white-space: nowrap;
}
.case-tbl td{
  padding: 10px 14px;
  vertical-align: middle;
}
.case-tbl .col-case{ width: 92px; white-space: nowrap; }
.case-tbl .col-case a.mono{ font-weight: 600; color: var(--accent); }
.case-tbl .col-case a.mono:hover{ text-decoration: underline; color: var(--accent-hover); }
.case-tbl .col-prio{ width: 90px; text-align: center; }
.case-tbl .col-prio .pill{ justify-content: center; width: 78px; }
.case-tbl .col-src{ width: 95px; }
.case-tbl .col-concern{ min-width: 200px; }
.case-tbl .col-team{ width: 130px; }
.case-tbl .col-assignee{ width: 110px; }
.case-tbl .col-status{ width: 110px; text-align: center; }
.case-tbl .col-status .pill{ justify-content: center; width: auto; min-width: 72px; }
.case-tbl .col-due{ width: 155px; text-align: right; white-space: nowrap; }

.concern-cell{
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.concern-main{
  font-weight: 600;
  color: var(--ink);
  line-height: 1.35;
  font-size: 13.5px;
}
.concern-sub{
  font-size: 12px;
  color: var(--muted);
  line-height: 1.25;
}
.due-cell{
  display: inline-flex;
  white-space: nowrap;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
.due-badge{
  font-size: 10.5px;
  padding: 1.5px 7px;
  line-height: 1.2;
}
.due-date{
  font-size: 12px;
  color: var(--muted);
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.due-date.text-crit{
  color: #B91C1C;
  font-weight: 500;
}
.badge-sub{
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .05em;
}

/* ================= Modern Rulebook Layout ================= */
.rb-container {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.rb-global-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
}
.rb-global-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-top: 14px;
}
.rb-global-item {
  background: var(--bg-sub, #f8fafc);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.rb-global-item label {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.rb-global-item input {
  font-size: 14px;
  font-weight: 600;
  padding: 6px 10px;
  background: var(--surface);
}
.rb-global-help {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.3;
}
.rb-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(340px, 1.15fr);
  gap: 20px;
  align-items: start;
}
@media (max-width: 960px) {
  .rb-workspace {
    grid-template-columns: 1fr;
  }
}
.rb-rules-col {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}
details.rb-rule-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  overflow: hidden;
}
details.rb-rule-card:hover {
  border-color: var(--line-strong, #cbd5e1);
}
details.rb-rule-card[open] {
  border-color: #cbd5e1;
  box-shadow: var(--shadow);
}
details.rb-rule-card summary {
  list-style: none;
  cursor: pointer;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--surface);
  user-select: none;
}
details.rb-rule-card[open] summary {
  border-bottom: 1px solid var(--line);
  background: #f8fafc;
}
details.rb-rule-card summary::-webkit-details-marker {
  display: none;
}
.rb-rule-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}
.rb-rule-header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.rb-rule-body {
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--surface);
}
.rb-sticky-sidebar {
  position: sticky;
  top: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  padding-right: 2px;
}
@media (max-width: 960px) {
  .rb-sticky-sidebar {
    position: static;
    max-height: none;
  }
}
.rb-chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 6px 0;
}
.rb-chip {
  background: #f1f5f9;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
  line-height: 1.2;
}
.rb-chip:hover {
  background: #e2e8f0;
  border-color: #94a3b8;
  color: var(--accent);
}
.rb-nav-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.rb-nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
  text-decoration: none;
  border: 1px solid transparent;
}
.rb-nav-item:hover {
  background: #f1f5f9;
  border-color: var(--line);
}
.rb-nav-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.rb-nav-dot.on {
  background: var(--ok);
  box-shadow: 0 0 0 2px var(--ok-bg);
}
.rb-nav-dot.off {
  background: #cbd5e1;
}
.rb-chevron {
  transition: transform 0.2s ease;
  color: var(--muted);
  flex-shrink: 0;
}

<script>

const RBI = "RBI directions on recovery agents (12 Aug 2022)";
const TEAMS = ["Investigation & Safety","Compliance","Grievance Redressal","Vendor Management"];
const SEV_RANK = {critical:3, high:2, medium:1};
const PRIO_OF = s => s==="critical"?"Critical":s==="high"?"High":s==="medium"?"Medium":"Clean";
const PRIO_RANK = {Critical:3, High:2, Medium:1, Clean:0};

function defaultRulebook(now){
  return {
    version:1, updatedAt:now, callWindow:{start:"08:00", end:"19:00"}, repeatLimit:3,
    history:[{version:1, at:now, by:"system", summary:"Initial rulebook mapped to RBI recovery-agent directions"}],
    rules:[
      {id:"threat", cat:"Threats & intimidation", sev:"critical", team:"Investigation & Safety", scope:"agent", enabled:true, restricted:false,
       ref:RBI+": no intimidation or harassment, verbal or physical; no threatening calls",
       why:"Suggests harm, retaliation or an intimidating home or office visit.",
       next:"Preserve the audio segment. Urgent human review; consider pausing the agent pending review.",
       pats:["teach (you|u) a lesson","sabak sikha","(come|coming|visit) (to )?your (home|house|office)","ghar (pe |par )?aa(unga|yenge|ke dekh)","ghar aaunga","dekh lena","anjaam","uthwa (lenge|dunga)","maar(unga|enge|denge)","break your","you will regret","pachhtaoge","make a scene"]},
      {id:"sexual", cat:"Sexual or physical misconduct", sev:"critical", team:"Investigation & Safety", scope:"agent", enabled:true, restricted:true,
       ref:RBI+": no harassment of any kind, verbal or physical; lender POSH and code of conduct",
       why:"Personal or sexual remarks, or a request to meet privately, directed at the customer.",
       next:"Restrict access. A trained reviewer contacts the customer through an approved channel.",
       pats:["meet me alone","come alone","akel(e|i) mil","you (are|look) (so )?(beautiful|pretty|sexy|hot)","bahut sundar","\\bsweetheart\\b","\\bdarling\\b","\\bjaanu\\b","personal favou?r"]},
      {id:"abuse", cat:"Verbal abuse & humiliation", sev:"high", team:"Compliance", scope:"agent", enabled:true, restricted:false,
       ref:RBI+": no verbal intimidation; no acts intended to humiliate the borrower",
       why:"Insulting or degrading language aimed at the customer.",
       next:"Compliance review. Log against the agent and vendor for conduct tracking.",

      {id:"misleading", cat:"Misleading statements", sev:"high", team:"Compliance", scope:"agent", enabled:true, restricted:false,
       ref:RBI+": no false or misleading representations",
       why:"Claims of arrest, police action, warrants or seizure that a recovery agent cannot make.",
       next:"Compliance review. Correct the information to the customer through an approved channel.",
       pats:["\\barrest","giraft?aar","\\bjail\\b","police (will|ko|aayegi|aa)","\\bwarrant\\b","\\bFIR\\b","seize your (house|home|property|car|bike|vehicle)","(ghar|gaadi|bike) (zabt|seize)","court (will|ka order)"]},

       next:"Offer a human follow-up through an approved channel.",

}
function defaultSettings(){ return {sla:{Critical:24, High:72, Medium:168}, aiEnabled:true}; }

function compileRule(r){
  const out = [];
  for(const p of (r.pats||[])){ try{ out.push(new RegExp(p, /FIR/.test(p)?"":"i")); }catch(e){} }
  return out;
}
function parseTranscript(text){
  return String(text||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const m = l.match(/^\[(\d{1,2}:\d{2})\]\s*([A-Za-z ]+?)\s*:\s*(.*)$/);
    return m ? {ts:m[1].padStart(5,"0"), speaker:m[2].toUpperCase().trim(), text:m[3]} : {ts:"", speaker:"", text:l};

}

function runRules(call, rb){
  const lines = parseTranscript(call.transcript);

  lines.forEach((ln,i)=>{

      if((r.scope==="agent") !== agent) continue;
      const hit = re.find(p=>p.test(ln.text));
      if(hit) flags.push({fid:r.id+"-L"+i, rule:r.id, category:r.cat, severity:r.sev, ts:ln.ts||"—", quote:ln.text, why:r.why, ref:r.ref, next:r.next, team:r.team,
        confidence:"Exact rule match", source:"Rule", line:i, restricted:!!r.restricted, review:null});

      why:"Call placed outside the permitted "+rb.callWindow.start+" to "+rb.callWindow.end+" window.", ref:RBI+": no calls before 8:00 am or after 7:00 pm",
      next:"Vendor Management to check the dialler schedule for this vendor.", team:"Vendor Management", confidence:"Exact rule match", source:"Rule", line:-1, restricted:false, review:null});
  }

  if(prior >= rb.repeatLimit){
    flags.push({fid:"repeat", rule:"repeat", category:"Repeat contact", severity:"medium", ts:"—", quote:prior+" earlier calls to this customer today; this is call "+(prior+1)+".",
      why:"Contact frequency above the policy threshold of "+rb.repeatLimit+" calls a day.", ref:"Lender contact-frequency policy (threshold set by Compliance)",
      next:"Vendor Management to review the vendor’s dialling pattern.", team:"Vendor Management", confidence:"Exact rule match", source:"Rule", line:-1, restricted:false, review:null});
  }

}
function sortFlags(flags){ return flags.slice().sort((a,b)=>(SEV_RANK[b.severity]||0)-(SEV_RANK[a.severity]||0)); }

  for(const t of TEAMS) if(teams.includes(t)) return t;

}
/* Re-run rules, keeping AI/manual flags and carrying reviews over */
function analyseCall(call, rb, nowIso){
  const prev = (call.analysis && call.analysis.flags) || [];
  const fresh = runRules(call, rb);
  for(const f of fresh){ const old = prev.find(p=>p.fid===f.fid && p.source==="Rule"); if(old && old.review) f.review = old.review; }
  const kept = prev.filter(p=>p.source!=="Rule");
  const flags = sortFlags(fresh.concat(kept));
  const act = activeFlags(flags);
  return {flags, priority:PRIO_OF(maxSev(act)), engine: (call.analysis && call.analysis.aiAt) ? "Rules + AI" : "Rules", aiSummary:(call.analysis&&call.analysis.aiSummary)||"", aiAt:(call.analysis&&call.analysis.aiAt)||null, rulebookVersion:rb.version, at:nowIso};
}

/* ---------- Synthetic sample dataset (deterministic) ---------- */
function rng(seed){ let s = seed>>>0; return ()=>{ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }

  const CUST = ["Salary 5 tareekh ko aayegi, tab pay kar dunga.","I can pay part of it next week.","Is mahine medical kharcha ho gaya, thoda time chahiye.","Please send me the payment link, I'll pay by Friday.","Business slow chal raha hai, do hafte de dijiye.","I already paid half at the branch yesterday."];
  const CLOSE = ["Theek hai, main payment link SMS kar raha hoon. Dhanyavaad.","Understood. I'll note a promise to pay. You'll get an SMS confirmation.","Late fee lag sakti hai aur credit score par asar pad sakta hai, isliye jaldi kar dijiye.","If it helps, I can arrange a callback from the branch about restructuring options.","Receipt mil jaye toh branch ko bhej dijiye, main record update karwa dunga."];
  const BAD = {

    abuse:["Besharam ho tum, paisa lete waqt yaad tha?","You are shameless. Useless fellow, always making excuses.","Itna bhi sharam nahi hai kya, bhikhari jaisa behave kar rahe ho."],
    privacy:["Aapke office mein call karke sabko bata dunga.","I will call your wife and tell her everything.","Society ke WhatsApp group mein naam daal denge, sabko pata chalega."],

    sexual:["Aap bahut sundar ho, akele milo toh settle kar dete hain.","You look beautiful in your photo. Meet me alone and we can settle this."],
    subtle:["Aapke bachche roz school jaate hain na? Dhyan rakhna.","We know where your shop is. It would be a pity if something happened to it."]
  };
  const DIST = ["Mujhe dar lag raha hai, please aisa mat boliye.","I'm scared. Please stop saying these things.","This makes me uncomfortable. I'm going to complain."];
  const day0 = new Date(nowMs); day0.setHours(0,0,0,0);
  const calls = [];
  for(let i=0;i<64;i++){
    const vd = pick(VENDORS), ag = pick(vd.agents), prod = pick(PRODUCTS);
    const hindi = R()<0.6;
    const dOff = Math.floor(R()*14);
    const d = new Date(day0.getTime() - dOff*86400000);
    let hh = 9 + Math.floor(R()*10), mm = Math.floor(R()*60);

      say("AGENT", pick(CLOSE));
      if(R()<0.5){ say("CUSTOMER", "Theek hai, dhanyavaad."); }
    }

}

function aiPrompt(call, rb){
  const cats = rb.rules.filter(r=>r.enabled && r.scope==="agent").map(r=>'"'+r.cat+'"').join(", ");
  const tx = parseTranscript(call.transcript).map(l=>"["+l.ts+"] "+(l.speaker||"AGENT")+": "+l.text).join("\n").slice(0,12000);
  return "You are a compliance analyst reviewing a recorded loan-recovery call made by a third-party collection agent on behalf of an Indian lender.\n"+
  "Review what the AGENT says; customer lines are context only. Flag conduct that may breach the RBI directions on recovery agents (12 Aug 2022: no intimidation or harassment of any kind, verbal or physical; no acts intended to humiliate the borrower publicly; no intrusion into the privacy of family members, referees or friends; no threatening calls; no false or misleading representations) or fair practices.\n"+
  "Use exactly one of these categories per flag: "+cats+".\n"+
  "You understand Hindi, Hinglish and English, including romanized Hindi. Judge meaning in context, not keywords, and catch implied threats. Do NOT flag firm but lawful statements: reminders of dues, late fees, credit-score impact, or legal process described accurately. Quote the agent's words verbatim from the transcript.\n"+
  'Reply with only JSON of this shape: {"summary": "one sentence on the call\'s conduct", "customer_distress": true|false, "flags": [{"category": "...", "timestamp": "mm:ss", "quote": "...", "why": "one sentence", "severity": "critical"|"high"|"medium", "confidence": 0.0-1.0, "next_step": "one sentence"}]}\n'+
  "Use an empty flags array if the agent's conduct is compliant.\n\n"+
  "Call metadata: product "+call.product+"; language "+call.lang+"; vendor "+call.vendor+"; call start "+call.time+".\nTranscript:\n"+tx;
}
const addH = (iso,h) => new Date(new Date(iso).getTime()+h*3600000).toISOString();
function makeCaseFromCall(call, settings, id, nowIso, by){
  const act = activeFlags(call.analysis.flags);
  const p = PRIO_OF(maxSev(act)) === "Clean" ? "Medium" : PRIO_OF(maxSev(act));
  const team = teamFor(act);
  return {id, source:"call", callId:call.id, complaintId:null, title:(act[0]?act[0].category:"Reviewer-raised concern")+" · "+call.vendor+" · "+call.agent,
    vendor:call.vendor, agent:call.agent, priority:p, team, status:"Open", decision:null, action:null, assignee:null,
    restricted:act.some(f=>f.restricted), flags:[], createdAt:nowIso, dueAt:addH(nowIso, (settings.sla[p]||72)), firstReviewAt:null, closedAt:null,
    history:[{at:nowIso, by:by||"system", kind:"system", text:"Case opened from "+call.id+" with "+act.length+" flag(s); routed to "+team+"."}]};
}
function complaintFlags(text, danger, rb){
  const flags = [];
  const physical = /(touch|touched|molest|grab|grabbed|\bhit\b|slap|slapped|pushed|assault|followed me|maara|chhua)/i;
  if(physical.test(text)) flags.push({fid:"c-physical", rule:"sexual", category:"Sexual or physical misconduct (reported)", severity:"critical", ts:"—", quote:text, why:"Customer reports physical contact or assault.", ref:RBI+": no harassment of any kind, verbal or physical", next:"Restrict access; urgent human contact with the customer.", team:"Investigation & Safety", confidence:"Customer report", source:"Complaint", line:-1, restricted:true, review:null});
  const extra = {threat:/(teach me a lesson|come to my (house|home|office)|threaten)/i, privacy:/(call|tell|inform) my (office|boss|family|wife|husband|neighbou?rs)/i, misleading:/(arrest|police|warrant|jail)/i, abuse:/(abus|insult|shout)/i};
  for(const r of rb.rules.filter(x=>x.enabled && x.scope==="agent")){
    const re = compileRule(r);
    if(re.some(p=>p.test(text)) || (extra[r.id] && extra[r.id].test(text))){
      if(!flags.some(f=>f.rule===r.id)) flags.push({fid:"c-"+r.id, rule:r.id, category:r.cat+" (reported)", severity:r.sev, ts:"—", quote:text, why:r.why, ref:r.ref, next:r.next, team:r.team, confidence:"Customer report", source:"Complaint", line:-1, restricted:!!r.restricted, review:null});

  return sortFlags(flags);
}
function findLinkedCall(calls, type, date, time){
  if(type!=="Phone call" || !date) return null;

}
function makeComplaint(input, calls, rb, settings, ids, nowIso, by){

  const p = PRIO_OF(maxSev(flags));
  const team = flags.some(f=>["danger","threat","sexual"].includes(f.rule)) ? "Investigation & Safety" : "Grievance Redressal";
  const link = findLinkedCall(calls, input.type, input.date, input.time);
  const cmp = {id:ids.cmp, receivedAt:nowIso, type:input.type, date:input.date, time:input.time, acct:input.acct||"", channel:input.channel, text:input.text, danger:!!input.danger, via:input.via||"customer-form", linkedCallId:link?link.id:null, caseId:ids.cs};

const ACTIONS = ["Warning issued to agent","Agent retrained","Agent removed from portfolio","Vendor penalty applied","Customer contacted with apology and correction","No further action"];

function buildSampleDataset(nowMs){

    if(subtle && ageDays>2){
      const ln = parseTranscript(c.transcript).findIndex(l=>/Dhyan rakhna|pity if something/i.test(l.text));
      const L = parseTranscript(c.transcript)[ln];
      c.analysis.flags.push({fid:"manual-"+ln, rule:"threat", category:"Threats & intimidation", severity:"critical", ts:L.ts, quote:L.text, why:"Implied threat to the customer’s family or property; missed by keyword rules.", ref:rb.rules[0].ref, next:rb.rules[0].next, team:"Investigation & Safety", confidence:"Reviewer judgement", source:"Manual", line:ln, restricted:false, review:{v:"valid", by:"sample", at:addH(c.createdAt, 20)}});

      for(const f of c.analysis.flags){ if(f.source!=="Manual") f.review = {v: confirm ? "valid" : (R()<0.6?"fp":"valid"), by:"sample", at:addH(k.firstReviewAt,1)}; }
      const decAt = addH(k.firstReviewAt, 6+Math.floor(R()*40));
      k.decision = confirm ? "confirmed" : "unsubstantiated";
      k.status = confirm ? "Violation confirmed" : "Not substantiated";
      k.history.push({at:decAt, by:"sample", kind:"action", text: confirm ? "Violation confirmed. Findings: audio reviewed; statement matches transcript and breaches policy." : "Not substantiated, with reasons: full call context reviewed; statement did not amount to a breach."});
      if(R()<0.85){
        k.action = confirm ? pick2(R, ACTIONS.slice(0,5)) : "No further action";
        k.status = "Closed"; k.closedAt = addH(decAt, 4+Math.floor(R()*30));
        k.history.push({at:k.closedAt, by:"sample", kind:"action", text:"Case closed. Corrective action: "+k.action+"."});
      }
      c.analysis.priority = PRIO_OF(maxSev(activeFlags(c.analysis.flags)));
    } else if(ageDays>1.5 && R()<0.5){
      k.assignee = "sample"; k.status = "Under review"; k.firstReviewAt = addH(k.createdAt, 3+Math.floor(R()*20));
      k.history.push({at:k.firstReviewAt, by:"sample", kind:"action", text:"Review started; case assigned."});
    }
    cases.push(k);
  }
  // complaints
  const flagged = calls.filter(c=>c.caseId);
  const pickC = [flagged[flagged.length-2], flagged[Math.floor(flagged.length/2)]].filter(Boolean);
  const inputs = [];
  if(pickC[0]) inputs.push({type:"Phone call", date:pickC[0].date, time:addMinutes(pickC[0].time, 25), acct:"4821", channel:"SMS", text:"The agent called about my EMI and said he will come to my house and that I will regret it. He also threatened to call my office.", danger:false, at:addH(pickC[0].createdAt, 5)});
  if(pickC[1]) inputs.push({type:"Phone call", date:pickC[1].date, time:addMinutes(pickC[1].time, -15), acct:"1937", channel:"Phone call", text:"The recovery agent was rude and insulting to me on the phone and told me police will come to arrest me.", danger:false, at:addH(pickC[1].createdAt, 8)});
  const d3 = new Date(nowMs-3*86400000), d1 = new Date(nowMs-86400000);
  const ds = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  inputs.push({type:"In-person visit", date:ds(d3), time:"18:30", acct:"7752", channel:"SMS", text:"Two men came to my shop for loan recovery and shouted at me in front of customers and neighbours.", danger:false, at:new Date(nowMs-2.6*86400000).toISOString()});
  inputs.push({type:"Message", date:ds(d1), time:"21:40", acct:"", channel:"Email", text:"I got WhatsApp messages late at night saying my photo will be shared on social media if I don't pay.", danger:false, at:new Date(nowMs-0.8*86400000).toISOString()});
  for(const inp of inputs){
    const r = makeComplaint(inp, calls, rb, settings, {cmp:"CMP-"+(cmp++), cs:"CS-"+(cs++)}, inp.at, "system");
    cases.push(r.cs); complaints.push(r.cmp);
  }
  return {calls, cases, complaints, rulebook:rb, settings};
}
function pick2(R, a){ return a[Math.floor(R()*a.length)]; }
function addMinutes(t, d){ const m = Math.max(0, Math.min(1439, toMins(t)+d)); return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
/*ENGINE-END*/

<script>
(function(){

function csvCell(v){ const s = String(v==null?"":v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function toCSV(rows){ return rows.map(r=>r.map(csvCell).join(",")).join("\n"); }
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=""; }
    else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(ch!=='\r') cell+=ch;
  }
  if(cell!=="" || row.length){ row.push(cell); rows.push(row); }

/* ================= state ================= */
const ST = {mode:"loading", ready:false, needsSetup:false, calls:{}, cases:{}, complaints:{}, rulebook:null, settings:null,

const NAMES = {}, asked = new Set();
const F = {range:14, calls:{q:"",vendor:"",result:"",days:"all"}, callsLimit:50, cases:{status:"active",priority:"",team:"",assignee:"",overdue:false,q:""}, audit:{q:"",type:""}, vendors:{days:30, sel:null}, reports:{days:30}};
window.F = F;
const AI = {callId:null, ctl:null, msg:null, msgFor:null};
const revealed = {};

const SBX = "rci-app-sbx-v1";

function whoLabel(id){ if(id==="system") return "System"; if(id==="sample") return "Sample reviewer"; if(id==="local") return "You"; if(!id) return "—"; if(id===ST.me.id) return "You"; return NAMES[id] || "Team member"; }

/* ================= persistence ================= */
const KEYMAP = {calls:"calls", cases:"cases", complaints:"complaints"};
async function put(coll, obj){
  ST[KEYMAP[coll]][obj.id] = obj;
  if(ST.mode==="shared"){
    try{ await db.doc(coll+"/"+obj.id).set(clone(obj)); }
    catch(e){ await writeFailed(e, ()=>db.doc(coll+"/"+obj.id).set(clone(obj))); }
  } else sbxSave();
  schedule();
}
async function putConfig(name, obj){

    catch(e){ await writeFailed(e, ()=>db.doc("config/"+name).set(clone(obj))); }
  } else sbxSave();

}
async function removeDoc(coll, id){
  delete ST[KEYMAP[coll]][id];
  if(ST.mode==="shared"){ try{ await db.doc(coll+"/"+id).delete(); }catch(e){ await writeFailed(e, ()=>db.doc(coll+"/"+id).delete()); } }
  else sbxSave();

}
async function writeFailed(e, retry){
  const code = e && e.code;
  if(code==="unavailable"){ await new Promise(r=>setTimeout(r, 400+Math.random()*600)); try{ await retry(); return; }catch(e2){} toast("The shared store did not respond. Your change is shown here but may not be saved; try again."); return; }
  if(code==="quota_exceeded"){ toast("The shared store is full. Export a backup and clear old data in Settings."); return; }
  if(code==="invalid_argument" || code==="revoked" || code==="not_granted"){ switchToSandbox(""); return; }

}
function switchToSandbox(msg){
  if(ST.mode==="sandbox") return;
  unsubs.forEach(u=>{ try{u();}catch(e){} }); unsubs = [];
  ST.mode = "sandbox"; ST.forced = true; sbxSave(); if(msg) toast(msg, 5000); schedule();
}

/* ================= init ================= */
let unsubs = [];
function applySavedTheme(){ try{ const t = localStorage.getItem("compliance_theme") || "light"; if(t==="dark") document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.removeAttribute("data-theme"); }catch(e){} }

applySavedNav();
async function init(){
  const C = window.claude;
  if(C && typeof C.use==="function"){
    const safe = p => Promise.resolve(p).catch(()=>null);
    [user, db, sample, downloads] = await Promise.all([safe(C.use("user")), safe(C.use("db")), safe(C.use("sample")), safe(C.use("downloads"))]);
  }
  if(user){
    try{ const me = await user.me(); ST.me.id = me.id; ST.me.name = me.name; ST.me.admin = !!me.canEdit; ST.me.owner = !!me.isOwner; }catch(e){}
    try{ ST.me.canWrite = await user.can("data.write"); }catch(e){ ST.me.canWrite = null; }
  }
  const saved = sbxLoad();
  if(db && ST.me.canWrite !== false && !(saved && saved.forcedSandbox)) startShared();
  else if(db) await startSandboxFromStore(saved);
  else startSandbox(saved);
}
function startSandbox(saved){
  ST.mode = "sandbox";
  const d = saved || buildSampleDataset(Date.now());
  loadData(d); ST.ready = true; if(!saved) sbxSave(); schedule();
}
async function startSandboxFromStore(saved){
  if(saved){ startSandbox(saved); return; }
  try{
    const [c,k,m,rb,se] = await Promise.all([db.collection("calls").get(), db.collection("cases").get(), db.collection("complaints").get(), db.doc("config/rulebook").get(), db.doc("config/settings").get()]);
    if(c.size){
      const d = {calls:c.docs.map(x=>x.data()), cases:k.docs.map(x=>x.data()), complaints:m.docs.map(x=>x.data()), rulebook: rb.exists?rb.data():null, settings: se.exists?se.data():null};
      startSandbox(normalize(d)); return;
    }
  }catch(e){}
  startSandbox(null);
}
function normalize(d){
  const o = {calls:{}, cases:{}, complaints:{}, rulebook:d.rulebook||defaultRulebook(nowIso()), settings:d.settings||defaultSettings()};
  for(const k of ["calls","cases","complaints"]){ const v = d[k]; if(Array.isArray(v)) v.forEach(x=>{ o[k][x.id]=clone(x); }); else if(v) Object.assign(o[k], clone(v)); }
  return o;
}
function loadData(d){
  const n = normalize(d);
  ST.calls = n.calls; ST.cases = n.cases; ST.complaints = n.complaints; ST.rulebook = n.rulebook; ST.settings = n.settings;
}
function startShared(){
  ST.mode = "shared";
  const got = {calls:false, cases:false, complaints:false, rulebook:false, settings:false};
  const check = () => {
    if(ST.ready || !Object.values(got).every(Boolean)) return;
    ST.ready = true;
    ST.needsSetup = !Object.keys(ST.calls).length && !ST.rulebook;
    if(!ST.rulebook) ST.rulebook = defaultRulebook(nowIso());
    if(!ST.settings) ST.settings = defaultSettings();
    schedule();
  };
  const onErr = e => { if(e && (e.code==="revoked"||e.code==="not_granted")) switchToSandbox(""); };
  for(const coll of ["calls","cases","complaints"]){
    unsubs.push(db.collection(coll).onSnapshot(s=>{ const o = {}; s.docs.forEach(d=>{ o[d.id] = d.data(); }); ST[coll] = o; got[coll] = true; check(); schedule(); }, onErr));
  }
  for(const name of ["rulebook","settings"]){
    unsubs.push(db.doc("config/"+name).onSnapshot(s=>{ if(s.exists) ST[name] = s.data(); else if(ST.ready && !ST[name]) ST[name] = name==="rulebook"?defaultRulebook(nowIso()):defaultSettings(); got[name] = true; check(); schedule(); }, onErr));
  }
  setTimeout(()=>{ if(!ST.ready){ Object.keys(got).forEach(k=>got[k]=true); check(); } }, 8000);
}

/* ================= domain operations ================= */
function getCall(id){ return ST.calls[id] ? clone(ST.calls[id]) : null; }
function getCase(id){ return ST.cases[id] ? clone(ST.cases[id]) : null; }
function hist(k, text, kind){ (k.history = k.history||[]).push({at:nowIso(), by:byMe(), kind:kind||"action", text}); }
async function syncCallCase(call){
  const act = activeFlags(call.analysis && call.analysis.flags);
  if(call.caseId && ST.cases[call.caseId]){
    const k = getCase(call.caseId);
    if(k.status==="Closed") return;
    const p = act.length ? PRIO_OF(maxSev(act)) : k.priority;
    const t = act.length ? teamFor(act) : k.team;
    const restricted = act.some(f=>f.restricted);
    if(p!==k.priority || t!==k.team || restricted!==k.restricted){
      if(p!==k.priority) k.history.push({at:nowIso(), by:"system", kind:"system", text:"Priority changed from "+k.priority+" to "+p+" after evidence update."});
      if(t!==k.team) k.history.push({at:nowIso(), by:"system", kind:"system", text:"Routed to "+t+"."});
      k.priority = p; k.team = t; k.restricted = restricted;
      await put("cases", k);
    }
    return;
  }
  if(!act.length) return;
  const k = makeCaseFromCall(call, ST.settings, newId("CS"), nowIso(), "system");
  call.caseId = k.id;
  await put("cases", k);
  await put("calls", call);
}
async function ingestCall(data, opts){
  const call = {id:data.id && !ST.calls[data.id] && /^[A-Za-z0-9_-]{1,40}$/.test(data.id) ? data.id : newId("CL"),
    vendor:data.vendor||"Unspecified", agent:data.agent||"—", product:data.product||"Unspecified", lang:data.lang||"Unspecified",
    date:data.date||dayStr(new Date()), time:data.time||"12:00", prior:Math.max(0, parseInt(data.prior,10)||0), transcript:String(data.transcript||"").trim(),
    source:opts&&opts.source||"manual", createdAt:nowIso(), createdBy:byMe(), caseId:null};
  call.analysis = analyseCall(call, RB(), nowIso());
  await put("calls", call);
  await syncCallCase(call);
  return call;
}
async function reanalyseAll(){
  const list = calls(); let i = 0, changed = 0;
  for(const c0 of list){
    const c = clone(c0); const before = JSON.stringify(activeFlags(c.analysis&&c.analysis.flags).map(f=>f.fid).sort());
    c.analysis = analyseCall(c, RB(), nowIso());
    const after = JSON.stringify(activeFlags(c.analysis.flags).map(f=>f.fid).sort());
    if(before!==after) changed++;
    await put("calls", c); await syncCallCase(c);
    if(++i % 10 === 0) toast("Re-analysed "+i+" of "+list.length+" calls…", 1500);
  }
  toast("Re-analysed "+list.length+" calls with rulebook v"+RB().version+". "+changed+" changed result.", 5000);
}
async function runAI(callId){
  if(!sample){ toast("AI review is not available in this view."); return; }
  if(ST.settings && ST.settings.aiEnabled===false){ toast("AI review is turned off in Settings."); return; }
  const call0 = getCall(callId); if(!call0) return;
  AI.callId = callId; AI.ctl = new AbortController(); AI.msg = null; schedule();
  try{
    const ai = await sample.json(aiPrompt(call0, RB()), {signal:AI.ctl.signal, modelTier:"default"});
    if(!ai || typeof ai!=="object") throw {code:"invalid_json"};
    const call = getCall(callId) || call0;
    const lines = parseTranscript(call.transcript);
    const cats = RB().rules.filter(r=>r.enabled && r.scope==="agent");
    let flags = (call.analysis.flags||[]).filter(f=>f.source!=="AI");
    flags.forEach(f=>{ delete f.aiConfirmed; delete f.aiConf; });
    let added = 0, confirmed = 0;
    for(const a of (Array.isArray(ai.flags)?ai.flags:[])){
      const r = cats.find(x=>x.cat===a.category); if(!r) continue;
      const ts = String(a.timestamp||"").padStart(5,"0");
      const conf = typeof a.confidence==="number" ? Math.round(Math.max(0,Math.min(1,a.confidence))*100)+"%" : "—";
      const twin = flags.find(f=>f.rule===r.id && f.ts===ts);
      if(twin){ twin.aiConfirmed = true; twin.aiConf = conf; confirmed++; continue; }
      const li = lines.findIndex(l=>l.ts===ts);
      flags.push({fid:"ai-"+r.id+"-"+ts, rule:r.id, category:r.cat, severity:SEV_RANK[a.severity]?a.severity:r.sev, ts:ts||"—", quote:String(a.quote||""), why:String(a.why||r.why), ref:r.ref, next:String(a.next_step||r.next), team:r.team, confidence:conf, source:"AI", line:li, restricted:!!r.restricted, review:null});
      added++;
    }
    call.analysis.flags = sortFlags(flags);
    call.analysis.aiSummary = String(ai.summary||""); call.analysis.aiAt = nowIso(); call.analysis.engine = "Rules + AI";
    call.analysis.priority = PRIO_OF(maxSev(activeFlags(call.analysis.flags)));
    await put("calls", call); await syncCallCase(call);
    AI.msg = "AI review finished: "+added+" new flag"+(added===1?"":"s")+", "+confirmed+" rule flag"+(confirmed===1?"":"s")+" confirmed."; AI.msgFor = callId;
  }catch(e){
    const code = e && e.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){ sample = null; AI.msg = "AI review is not available in this view. Rules-engine results are shown."; }
    else if(code==="cancelled") AI.msg = "AI review stopped.";
    else if(code==="rate_limited") AI.msg = "AI review is busy. Try again in a minute.";
    else if(code==="session_expired") AI.msg = "Sign in to Claude again to run AI review.";
    else AI.msg = "AI review could not finish. You can run it again.";
    AI.msgFor = callId;
  }finally{ AI.callId = null; AI.ctl = null; schedule(); }
}

/* ================= metrics ================= */
function cutoffDay(days){ if(days==="all") return "0000-00-00"; const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-(days-1)); return dayStr(d); }
function cutoffIso(days){ if(days==="all") return "0000"; const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-(days-1)); return d.toISOString(); }
const isOverdue = k => k.status!=="Closed" && k.dueAt && new Date(k.dueAt) < new Date();
const isFlagged = c => activeFlags(c.analysis&&c.analysis.flags).length>0;
function callPrio(c){ return (c.analysis && c.analysis.priority) || "Clean"; }
function outsideWindow(c){ const m = toMins(c.time), s = toMins(RB().callWindow.start), e = toMins(RB().callWindow.end); return m!=null && (m<s || m>=e); }
function metrics(days){
  const cd = cutoffDay(days), ci = cutoffIso(days);
  const cl = calls().filter(c=>c.date>=cd);
  const fl = cl.filter(isFlagged);
  const ks = cases().filter(k=>k.createdAt>=ci);
  const open = cases().filter(k=>k.status!=="Closed");
  const fr = ks.filter(k=>k.firstReviewAt).map(k=>hoursBetween(k.createdAt,k.firstReviewAt));
  const cls = ks.filter(k=>k.closedAt).map(k=>hoursBetween(k.createdAt,k.closedAt));
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  return {calls:cl, flagged:fl, cases:ks, open, critOpen:open.filter(k=>k.priority==="Critical"), overdue:open.filter(isOverdue), avgFirst:avg(fr), avgClose:avg(cls)};
}
function catCounts(cl){
  const m = {};
  for(const c of cl) for(const f of activeFlags(c.analysis.flags)) m[f.category] = (m[f.category]||0)+1;
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function vendorStats(days){
  const cd = cutoffDay(days), ci = cutoffIso(days);
  const V = {};
  const g = (v,a) => { V[v] = V[v] || {v, calls:0, flagged:0, crit:0, late:0, open:0, confirmed:0, unsub:0, agents:{}}; const o = V[v]; if(a){ o.agents[a] = o.agents[a] || {a, calls:0, flagged:0, crit:0, late:0, open:0, confirmed:0, unsub:0}; } return o; };
  for(const c of calls().filter(c=>c.date>=cd)){
    const o = g(c.vendor, c.agent), a = o.agents[c.agent];
    for(const x of [o,a]){ x.calls++; if(isFlagged(c)) x.flagged++; if(callPrio(c)==="Critical") x.crit++; if(outsideWindow(c)) x.late++; }
  }
  for(const k of cases().filter(k=>k.createdAt>=ci && k.vendor)){
    const o = g(k.vendor, k.agent||"—"), a = o.agents[k.agent||"—"];
    for(const x of [o,a]){ if(k.status!=="Closed") x.open++; if(k.decision==="confirmed") x.confirmed++; if(k.decision==="unsubstantiated") x.unsub++; }
  }
  return Object.values(V).sort((a,b)=>pct(b.flagged,b.calls)-pct(a.flagged,a.calls));
}

/* ================= rendering infra ================= */
let pending = false, lastRoute = null;
function schedule(){ if(pending) return; pending = true; requestAnimationFrame(()=>{ pending = false; render(); }); }
function route(){ const h = decodeURIComponent(location.hash.replace(/^#/,"")) || "overview"; return h; }
function stash(){
  const s = {vals:{}, focus:null, sel:null, scroll:window.scrollY};
  document.querySelectorAll("#view [id]").forEach(el=>{ if(el.matches("input,textarea,select")){ s.vals[el.id] = el.type==="checkbox" ? {c:el.checked} : {v:el.value}; } });
  const a = document.activeElement; if(a && a.id && a.closest("#view")){ s.focus = a.id; try{ s.sel = [a.selectionStart, a.selectionEnd]; }catch(e){} }
  document.querySelectorAll("#view details[id]").forEach(d=>{ s.vals[d.id] = {open:d.open}; });
  return s;
}
function restore(s){
  for(const [id,v] of Object.entries(s.vals)){
    const el = document.getElementById(id); if(!el || el.dataset.fresh) continue;
    if("c" in v) el.checked = v.c; else if("v" in v && el.matches("input,textarea,select") && el.type!=="file") el.value = v.v; else if("open" in v && el.tagName==="DETAILS") el.open = v.open;
  }
  if(s.focus){ const el = document.getElementById(s.focus); if(el){ el.focus({preventScroll:true}); if(s.sel && s.sel[0]!=null){ try{ el.setSelectionRange(s.sel[0], s.sel[1]); }catch(e){} } } }
}
function render(){
  if(!ST.ready) return;
  const r = route();
  const isIntake = r==="intake";
  $("app").style.gridTemplateColumns = isIntake ? "minmax(0,1fr)" : "";
  $("nav").hidden = isIntake;
  if(!isIntake) renderNav(r);
  const same = r===lastRoute;
  const s = same ? stash() : null;
  let html;
  try{ html = page(r); }catch(e){ console.error(e); html = `<div class="banner crit">Something went wrong rendering this page: ${esc(e.message)}</div>`; }
  $("view").innerHTML = html;
  if(s){ restore(s); } else { window.scrollTo(0,0); }
  lastRoute = r;
  resolveNames();
}
function resolveNames(){
  if(!user || typeof user.profiles!=="function") return;
  const ids = new Set();
  for(const k of cases()){ if(k.assignee) ids.add(k.assignee); for(const h of (k.history||[])) ids.add(h.by); }
  const need = [...ids].filter(id=>id && !["system","sample","local","unknown"].includes(id) && id!==ST.me.id && !asked.has(id));
  if(!need.length) return;
  need.forEach(id=>asked.add(id));
  user.profiles(need).then(ps=>{ for(const id of need){ const p = ps && ps[id]; NAMES[id] = (p && p.name) || "Team member"; } schedule(); }).catch(()=>{});
}

function page(r){
  if(ST.needsSetup && r!=="intake") return pSetup();
  if(r==="overview") return pOverview();
  if(r==="calls") return pCalls();
  if(r.startsWith("call-")) return pCall(r.slice(5));
  if(r==="add") return pAdd();
  if(r==="cases") return pCases();
  if(r.startsWith("case-")) return pCase(r.slice(5));
  if(r==="complaints") return pComplaints();
  if(r==="log") return pIntake(true);
  if(r==="intake") return pIntake(false);
  if(r==="vendors") return pVendors();
  if(r==="rulebook") return pRulebook();
  if(r==="reports") return pReports();
  if(r==="audit") return pAudit();
  if(r==="settings") return pSettings();
  return `<div class="empty">That page does not exist. <a href="#overview">Go to Overview</a></div>`;
}

function dailyChart(days){
  const today = new Date(); today.setHours(0,0,0,0);
  const ds = []; for(let i=days-1;i>=0;i--){ const d = new Date(today); d.setDate(d.getDate()-i); ds.push(dayStr(d)); }
  const by = {}; ds.forEach(d=>by[d]={r:0,f:0});
  for(const c of calls()){ if(by[c.date]){ by[c.date].r++; if(isFlagged(c)) by[c.date].f++; } }
  const max = Math.max(1, ...ds.map(d=>by[d].r));
  const top = Math.max(2, Math.ceil(max/2)*2);
  const W = 720, H = 220, L = 34, B = 30, T = 10, R = 8;
  const bw = (W-L-R)/ds.length;
  const y = v => T + (H-T-B) * (1 - v/top);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily calls reviewed and flagged">`;
  for(const g of [0, top/2, top]){ s += `<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(g)+4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${g}</text>`; }
  ds.forEach((d,i)=>{
    const x = L + i*bw + bw*0.15, w = bw*0.7, v = by[d];
    if(v.r) s += `<rect x="${x}" y="${y(v.r)}" width="${w}" height="${y(0)-y(v.r)}" rx="2" style="fill:var(--bar2)"><title>${fmtD(d)}: ${v.r} reviewed</title></rect>`;
    if(v.f) s += `<rect x="${x}" y="${y(v.f)}" width="${w}" height="${y(0)-y(v.f)}" rx="2" style="fill:var(--accent)"><title>${fmtD(d)}: ${v.f} flagged</title></rect>`;
    const step = days>14 ? 5 : days>7 ? 2 : 1;
    if((ds.length-1-i) % step === 0) s += `<text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${fmtD(d)}</text>`;
  });
  s += `</svg>`;
  return s + `<div class="legend"><span><i class="sw" style="background:var(--bar2)"></i>Reviewed</span><span><i class="sw" style="background:var(--accent)"></i>Flagged</span></div>`;
}
function formatConcern(title, vendor, agent){
  if(!title) return "—";
  const parts = String(title).split(" · ");
  const main = parts[0] || title;
  const sub = parts.length > 1 ? parts.slice(1).join(" · ") : (vendor ? (vendor + (agent ? " · " + agent : "")) : "");
  return `<div class="concern-cell"><span class="concern-main">${esc(main)}</span>${sub ? `<span class="concern-sub">${esc(sub)}</span>` : ""}</div>`;
}
function formatDue(k){
  if(k.status === "Closed") {
    return `<div class="due-cell"><span class="badge-sub">Closed</span><span class="due-date mono">${esc(fmtDT(k.closedAt))}</span></div>`;
  }
  if(isOverdue(k)){
    return `<div class="due-cell"><span class="pill p-critical due-badge">Overdue</span><span class="due-date mono text-crit">${esc(fmtDT(k.dueAt))}</span></div>`;
  }
  return `<div class="due-cell"><span class="due-date mono">${esc(fmtDT(k.dueAt))}</span></div>`;
}
function caseTable(list, compact){
  if(!list.length) return `<div class="empty">No cases match.</div>`;
  return `<div class="tw"><table class="case-tbl"><thead><tr><th class="col-case">Case</th><th class="col-prio">Priority</th>${compact?"":`<th class="col-src">Source</th>`}<th class="col-concern">Concern</th>${compact?"":`<th class="col-team">Team</th><th class="col-assignee">Assignee</th>`}<th class="col-status">Status</th><th class="col-due">Due</th><th class="col-action" style="text-align:right;width:115px">Details</th></tr></thead><tbody>${
    list.map(k=>`<tr class="rowlink" data-href="case-${esc(k.id)}" tabindex="0"><td class="col-case"><a class="mono" href="#case-${esc(k.id)}">${esc(k.id)}</a>${k.restricted?` <span class="src man">Restricted</span>`:""}</td><td class="col-prio">${pillP(k.priority)}</td>${compact?"":`<td class="col-src">${k.source==="complaint"?"Complaint":"Call"}<br><span class="mono">${esc(k.callId||k.complaintId||"")}</span></td>`}<td class="col-concern">${formatConcern(k.title, k.vendor, k.agent)}</td>${compact?"":`<td class="col-team">${esc(k.team)}</td><td class="col-assignee">${esc(k.assignee?whoLabel(k.assignee):"Unassigned")}</td>`}<td class="col-status">${pillS(k.status)}</td><td class="col-due">${formatDue(k)}</td><td class="col-action" style="text-align:right"><a class="btn-detail" href="#case-${esc(k.id)}">See details →</a></td></tr>`).join("")}</tbody></table></div>`;
}

function pCalls(){
  const f = F.calls, cd = cutoffDay(f.days);
  const q = f.q.trim().toLowerCase();
  let list = calls().filter(c=>c.date>=cd);
  if(f.vendor) list = list.filter(c=>c.vendor===f.vendor);
  if(f.result==="flagged") list = list.filter(isFlagged); else if(f.result==="clean") list = list.filter(c=>!isFlagged(c)); else if(f.result) list = list.filter(c=>callPrio(c)===f.result);
  if(q) list = list.filter(c=>(c.id+" "+c.agent+" "+c.vendor+" "+c.product+" "+c.transcript).toLowerCase().includes(q));
  list.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const vendors = [...new Set(calls().map(c=>c.vendor))].sort();
  const shown = list.slice(0, F.callsLimit);
  return `${head("Calls","Every recorded recovery call reviewed against the rulebook. Open a call to see evidence, run AI review or mark flags.",
    `${btnBack("overview")}<a class="btn primary" href="#add">+ Add or import calls</a><button class="btn" data-act="reanalyse">Re-analyse all (rulebook v${RB().version})</button>`)}

function flagCard(f, ctx){
  const src = f.source==="AI" ? `<span class="src ai">AI review</span>` : f.source==="Manual" ? `<span class="src man">Reviewer-added</span>` : f.source==="Complaint" ? `<span class="src">Customer report</span>` : `<span class="src">Rule</span>`+(f.aiConfirmed?` <span class="src ai">AI confirmed</span>`:"");
  const conf = f.source==="AI" ? "AI confidence "+esc(f.confidence) : f.aiConfirmed ? esc(f.confidence)+" · AI "+esc(f.aiConf) : esc(f.confidence);
  const rv = f.review ? `<span class="chip ${f.review.v==="valid"?"on":""}">${f.review.v==="valid"?"Marked valid":"Marked false positive"} · ${esc(whoLabel(f.review.by))}</span>` : `<span class="note">Not yet reviewed</span>`;
  const btns = ctx ? `<div class="actions">${rv}<button class="btn sm" data-act="flag-review" data-ctx="${ctx}" data-fid="${esc(f.fid)}" data-v="valid">Valid</button><button class="btn sm" data-act="flag-review" data-ctx="${ctx}" data-fid="${esc(f.fid)}" data-v="fp">False positive</button>${f.review?`<button class="btn sm" data-act="flag-review" data-ctx="${ctx}" data-fid="${esc(f.fid)}" data-v="">Clear</button>`:""}</div>` : "";
  const showQuote = !(f.source==="Complaint" && f.rule!=="danger");
  return `<div class="flag s-${esc(f.severity)} ${f.review&&f.review.v==="fp"?"fp":""}">
    <div class="fh"><strong>${esc(f.category)}</strong>${pillP(PRIO_OF(f.severity))}${src}<span class="mono">${esc(f.ts)}</span></div>
    ${showQuote?`<blockquote>“${esc(f.quote)}”</blockquote>`:""}
    <dl class="ev"><dt>Rule or policy</dt><dd>${esc(f.ref)}</dd><dt>Why flagged</dt><dd>${esc(f.why)}</dd><dt>Confidence</dt><dd>${conf}</dd><dt>Next step</dt><dd>${esc(f.next)}</dd></dl>
    ${btns}
  </div>`;
}
function pCall(id){
  const c = ST.calls[id];
